name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Check for hardcoded DSL symbols
        run: uv run python scripts/lint_no_hardcoded_symbols.py

      - name: Check for DAG-bypass patterns (advisory)
        run: uv run python scripts/lint_no_dag_bypass.py

      - name: Check plugin skills are up to date
        # plugins/google-workspace-unlimited/skills/ is generated from the
        # same ModuleWrapper introspection the server uses at startup. If a
        # change to the models/generators alters the output, regenerate with
        # scripts/generate_plugin_skills.py and commit the result.
        # Gated to the pinned Python (.python-version) — introspected
        # signature reprs can differ across minor versions.
        if: matrix.python-version == '3.12'
        run: uv run python scripts/generate_plugin_skills.py --check

      - name: Check tool description quality
        # HF_HUB_OFFLINE keeps the server import from spawning background
        # model downloads that outlive this step and corrupt the HF cache
        # for later steps; the lint only reads tool descriptions.
        env:
          HF_HUB_OFFLINE: "1"
        run: uv run python scripts/lint_tool_descriptions.py

      - name: Run unit tests
        shell: bash {0}
        env:
          # FastMCP 4 bridges camelCase MCP field reads with warnings; fail
          # fast in CI so no snake_case leftovers slip through.
          FASTMCP_MCP_CAMELCASE_COMPAT: "false"
        run: |
          # Some C++ extensions (qdrant-client, tokenizers) call terminate()
          # during interpreter shutdown, producing exit code 134 (SIGABRT)
          # even when all tests pass — which also masks pytest's real exit
          # code. Trust the junit report instead of the exit code: 134 only
          # counts as success when the report shows zero failures/errors.
          uv run pytest tests/ -v --tb=short --ignore=tests/client --ignore=tests/content_mapping --junitxml=pytest-report.xml
          rc=$?
          if [ $rc -eq 0 ]; then
            exit 0
          fi
          if [ $rc -eq 134 ] && [ -f pytest-report.xml ] && \
             ! grep -qE '(failures|errors)="[1-9]' pytest-report.xml; then
            echo "Tests passed (SIGABRT during interpreter shutdown ignored)"
            exit 0
          fi
          exit $rc
