<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2d4d"/>
      <stop offset="0.55" stop-color="#0a4a6e"/>
      <stop offset="1" stop-color="#0d7a8a"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fdbe8"/>
      <stop offset="1" stop-color="#e8fbff"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8fbff"/>
      <stop offset="1" stop-color="#7fdbe8"/>
    </linearGradient>
  </defs>

  <!-- rounded-square tile -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)"/>

  <!-- connector node cluster (MCP): hub + three satellites -->
  <g stroke="#ffe9a8" stroke-width="10" stroke-linecap="round">
    <line x1="256" y1="150" x2="184" y2="96"/>
    <line x1="256" y1="150" x2="330" y2="92"/>
    <line x1="256" y1="150" x2="256" y2="228"/>
  </g>
  <circle cx="184" cy="96" r="17" fill="#ffe9a8"/>
  <circle cx="330" cy="92" r="17" fill="#ffe9a8"/>
  <circle cx="256" cy="150" r="27" fill="#0b3a5c" stroke="#ffd76b" stroke-width="13"/>

  <!-- river: three flowing strokes -->
  <g fill="none" stroke-linecap="round">
    <path d="M74 268 C 150 230, 210 306, 286 268 S 400 230, 438 268"
          stroke="url(#wave1)" stroke-width="30"/>
    <path d="M74 340 C 150 302, 210 378, 286 340 S 400 302, 438 340"
          stroke="url(#wave2)" stroke-width="30" opacity="0.85"/>
    <path d="M74 412 C 150 374, 210 450, 286 412 S 400 374, 438 412"
          stroke="url(#wave1)" stroke-width="30" opacity="0.6"/>
  </g>
</svg>
